<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-area {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
        }
        .hole {
            width: 100px;
            height: 100px;
            background: #8b4513;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .mole {
            width: 60px;
            height: 60px;
            background: #d2691e;
            border-radius: 50%;
            position: absolute;
            bottom: -60px;
            left: 20px;
            transition: bottom 0.1s;
        }
        .mole.show {
            bottom: 10px;
        }
        .game-info {
            text-align: center;
            font-size: 20px;
            margin: 15px 0;
        }
        #startBtn {
            background: #42a5f5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
        }
        #startBtn:hover {
            background: #1e88e5;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h2>Whack-a-Mole Game</h2>
    </div>

    <div class="container">
        <h1>Play Whack-a-Mole</h1>
        <div class="game-info">
            Score: <span id="score">0</span> | Time Left: <span id="time">30</span>s
        </div>
        <button id="startBtn">Start Game</button>
        <div class="game-area" id="gameArea">
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        let score = 0;
        let timeLeft = 30;
        let timerId = null;
        let moleTimerId = null;
        let gameRunning = false;

        function randomMole() {
            holes.forEach(hole => hole.querySelector('.mole').classList.remove('show'));
            const randomHole = holes[Math.floor(Math.random() * holes.length)];
            randomHole.querySelector('.mole').classList.add('show');
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            gameRunning = true;
            startBtn.disabled = true;
            
            timerId = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            moleTimerId = setInterval(randomMole, 800);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerId);
            clearInterval(moleTimerId);
            holes.forEach(hole => hole.querySelector('.mole').classList.remove('show'));
            startBtn.disabled = false;
            alert('Game Over! Your score: ' + score);
        }

        holes.forEach(hole => {
            hole.addEventListener('click', () => {
                if (hole.querySelector('.mole').classList.contains('show')) {
                    score++;
                    scoreEl.textContent = score;
                    hole.querySelector('.mole').classList.remove('show');
                }
            });
        });

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
