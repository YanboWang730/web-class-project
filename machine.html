<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole Game</title>
    <meta property="og:title" content="Web Tech Class Project">
    <meta property="og:description" content="Web course project with quote page, project list and whack-a-mole game.">
    <meta property="og:image" content="https://gitee.com/wyb730/web-class-project/raw/master/images/og-class.jpg">
    <meta property="og:url" content="https://gitee.com/wyb730/web-class-project">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-area {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            padding: 30px;
            background-color: #e3f2fd;
            border-radius: 16px;
        }
        .hole {
            width: 100px;
            height: 100px;
            background: #3e2723;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.5);
        }
        .mole {
            width: 60px;
            height: 60px;
            background: #a1887f;
            border-radius: 50%;
            position: absolute;
            bottom: -60px;
            left: 20px;
            transition: bottom 0.1s;
        }
        .mole::before, .mole::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #222;
            border-radius: 50%;
            top: 18px;
        }
        .mole::before {
            left: 16px;
        }
        .mole::after {
            right: 16px;
        }
        .mole.show {
            bottom: 10px;
        }
        .game-info {
            text-align: center;
            font-size: 20px;
            margin: 15px 0;
        }
        #startBtn {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
        }
        #startBtn:hover {
            background: #0d47a1;
        }
        #endBtn {
            background: #e53935;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
        }
        #endBtn:hover {
            background: #c62828;
        }
        .button-group {
            text-align: center;
            margin: 20px auto;
        }
    </style>
</head>
<body class="game">
    <div class="banner">
        <h2>Whack-a-Mole Game</h2>
    </div>

    <div class="container">
        <h1>Play Whack-a-Mole</h1>
        <div class="game-info">
            Score: <span id="score">0</span> | Time Left: <span id="time">30</span>s
        </div>
        <div class="button-group">
            <button id="startBtn">Start Game</button>
            <button id="endBtn">End Game</button>
        </div>
        <div class="game-area" id="gameArea">
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
            <div class="hole"><div class="mole"></div></div>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const endBtn = document.getElementById('endBtn');
        let score = 0;
        let timeLeft = 30;
        let timerId = null;
        let moleTimerId = null;
        let gameRunning = false;

        function randomMole() {
            holes.forEach(hole => hole.querySelector('.mole').classList.remove('show'));
            const randomHole = holes[Math.floor(Math.random() * holes.length)];
            randomHole.querySelector('.mole').classList.add('show');
        }

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
            gameRunning = true;
            startBtn.disabled = true;
            
            timerId = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            moleTimerId = setInterval(randomMole, 800);
        }

        function endGame() {
            gameRunning = false;
            clearInterval(timerId);
            clearInterval(moleTimerId);
            holes.forEach(hole => hole.querySelector('.mole').classList.remove('show'));
            startBtn.disabled = false;
            alert('Game Over! Your score: ' + score);
        }

        holes.forEach(hole => {
            hole.addEventListener('click', () => {
                if (hole.querySelector('.mole').classList.contains('show')) {
                    score++;
                    scoreEl.textContent = score;
                    hole.querySelector('.mole').classList.remove('show');
                }
            });
        });

        startBtn.addEventListener('click', startGame);
        endBtn.addEventListener('click', () => {
            if (gameRunning) {
                endGame();
            }
        });
    </script>
    <footer>
        <p>© 2026 Web Tech Class Project</p>
    </footer>
</body>
</html>
